name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            django: "Django>=4.2,<5.0"
          - python-version: "3.12"
            django: "Django>=5.2,<6.0"
          - python-version: "3.13"
            django: "Django>=5.2,<6.0"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "${{ matrix.django }}" djangorestframework pytest pytest-django
      - name: Run tests
        run: python -m pytest -q
